[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kindleforge"
version = "1.0.0"
description = "Local-first KDP interior and full-wrap cover generator"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.4",
  "pypdf>=5.0",
  "reportlab>=4.2",
  "httpx>=0.27",
  "typer>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
kindleforge = "kindleforge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["kindleforge*"]
